<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Deploy Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#1e293b] border border-slate-700 p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-500 tracking-tight">DeployStation</h1>
            <p class="text-slate-400 text-sm mt-1 font-medium">iPad-to-GitHub Hosting Control</p>
        </div>
        
        <div class="space-y-5">
            <!-- GitHub Token Input -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1">Personal Access Token</label>
                <input id="token" type="password" placeholder="ghp_your_secret_token" 
                       class="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition-all text-blue-400">
            </div>
            
            <!-- GitHub Username -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1">GitHub Username</label>
                <input id="owner" type="text" placeholder="e.g., smartboyk2015" 
                       class="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition-all">
            </div>
            
            <!-- Repository Name -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1">Target Repository</label>
                <input id="repo" type="text" placeholder="e.g., my-cool-project" 
                       class="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition-all">
            </div>
            
            <!-- Deployment Button -->
            <button onclick="handleDeployment()" id="deployBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/30 transition-all flex items-center justify-center gap-2">
                <span id="btnIcon">🚀</span>
                <span id="btnText">Deploy to Production</span>
            </button>
        </div>

        <!-- Feedback Area -->
        <div id="statusBox" class="mt-8 p-3 rounded-lg bg-[#0f172a]/50 hidden">
            <p id="statusMsg" class="text-center text-xs font-mono"></p>
        </div>
    </div>

    <script>
        async function handleDeployment() {
            const token = document.getElementById('token').value;
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const statusBox = document.getElementById('statusBox');
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('deployBtn');
            const btnText = document.getElementById('btnText');

            // Basic Validation
            if (!token || !owner || !repo) {
                alert("Missing information! Please fill all fields.");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btnText.innerText = "Processing...";
            statusBox.classList.remove('hidden');
            statusMsg.className = "text-center text-xs font-mono text-blue-400";
            statusMsg.innerText = "📡 Waking up GitHub Action Engine...";

            try {
                // The JavaScript Fetch command that connects to GitHub's API
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'ipad_deploy_trigger' // This must match your .yml file!
                    })
                });

                if (response.status === 204) {
                    statusMsg.className = "text-center text-xs font-mono text-green-400 font-bold";
                    statusMsg.innerText = "✅ SUCCESS: Build triggered! Site updating now.";
                } else {
                    const errorData = await response.json().catch(() => ({ message: "Check Token/Repo name" }));
                    statusMsg.className = "text-center text-xs font-mono text-red-400";
                    statusMsg.innerText = "❌ ERROR: " + errorData.message;
                }
            } catch (error) {
                statusMsg.className = "text-center text-xs font-mono text-red-500";
                statusMsg.innerText = "❌ NETWORK ERROR: Check iPad connection.";
            } finally {
                btn.disabled = false;
                btnText.innerText = "Deploy to Production";
            }
        }
    </script>
</body>
</html>
