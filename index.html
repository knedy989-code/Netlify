<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Server Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-400">DeployStation</h1>
            <p class="text-slate-400 text-sm mt-2">Manage your servers from your iPad</p>
        </div>
        
        <div class="space-y-5">
            <!-- 1. The GitHub Token (Your Secret Key) -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase ml-1 mb-1">GitHub Token</label>
                <input id="token" type="password" placeholder="ghp_xxxxxxxxxxxx" 
                       class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            
            <!-- 2. Your GitHub Username -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase ml-1 mb-1">Username</label>
                <input id="owner" type="text" placeholder="Your GitHub Name" 
                       class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            
            <!-- 3. The Repository you want to host -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase ml-1 mb-1">Repository</label>
                <input id="repo" type="text" placeholder="my-web-project" 
                       class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            
            <!-- The Magic Button -->
            <button onclick="startDeploy()" id="deployBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all">
                🚀 Deploy to Production
            </button>
        </div>

        <p id="status" class="mt-8 text-center text-xs font-mono text-slate-500 italic"></p>
    </div>

    <script>
        async function startDeploy() {
            const token = document.getElementById('token').value;
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('deployBtn');

            if (!token || !owner || !repo) {
                status.innerText = "⚠️ Error: Fill in all fields!";
                status.classList.add('text-red-400');
                return;
            }

            // Lock button and show loading
            btn.disabled = true;
            btn.innerText = "Deploying...";
            status.innerText = "📡 Sending signal to GitHub Actions...";
            status.classList.remove('text-red-400', 'text-green-400');

            try {
                // This Fetch call triggers the 'ipad_deploy_trigger' inside your .yml file
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'ipad_deploy_trigger'
                    })
                });

                if (response.status === 204) {
                    status.classList.add('text-green-400');
                    status.innerText = "✅ Success! Build started. Check GitHub Actions.";
                } else {
                    const data = await response.json();
                    status.classList.add('text-red-400');
                    status.innerText = "❌ Failed: " + (data.message || "Check your Token.");
                }
            } catch (err) {
                status.classList.add('text-red-400');
                status.innerText = "❌ Network Error. Check your iPad's connection.";
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 Deploy to Production";
            }
        }
    </script>
</body>
</html>
